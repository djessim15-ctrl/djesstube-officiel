<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DjessTube — le webtoon · Épisode 1 : Zéro pub</title>
<style>
  :root {
    --bg: #0a0a0f; --panneau: #17171f; --bord: #2a2a38;
    --texte: #f2f2f7; --texte2: #9a9aad;
    --accent: #ff3d5a; --accent2: #ff7a3d;
    --degrade: linear-gradient(135deg, #ff3d5a, #ff7a3d);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 80% -10%, #1c1230 0%, var(--bg) 55%), var(--bg);
    color: var(--texte); font-family: 'Segoe UI', Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px;
    padding: 12px 20px; background: rgba(10,10,15,.8); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--bord);
  }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
  .logo .t { background: var(--degrade); color: #fff; padding: 2px 9px; border-radius: 9px; margin-left: 2px; }
  .ep { color: var(--texte2); font-size: 14px; }
  .actions { margin-left: auto; display: flex; gap: 10px; }
  .btn {
    display: inline-block; padding: 9px 16px; border-radius: 20px; font-size: 13.5px; font-weight: 600;
    color: #fff; background: var(--degrade); text-decoration: none; box-shadow: 0 4px 16px rgba(255,61,90,.35);
  }
  .btn.secondaire { background: var(--panneau); border: 1px solid var(--bord); box-shadow: none; color: var(--texte); }
  .colonne { max-width: 780px; margin: 0 auto; padding: 26px 14px 90px; }
  .colonne img { width: 100%; display: block; border-radius: 14px; border: 1px solid var(--bord); }
  .note { text-align: center; color: var(--texte2); font-size: 13px; margin-top: 22px; line-height: 1.7; }
  .note a { color: var(--accent2); }
</style>
</head>
<body>
<header>
  <div class="logo">Djess<span class="t">Tube</span></div>
  <div class="ep">le webtoon · Épisode 1 : Zéro pub</div>
  <div class="actions">
    <a class="btn" href="djesstube-ep1_A5.pdf" download>PDF A5</a>
    <a class="btn secondaire" href="../index.html">← DjessTube</a>
  </div>
</header>
<main class="colonne">
  <img src="out/ep1_strip.jpg" alt="DjessTube — le webtoon, épisode 1 : Zéro pub. Léo, excédé par les pubs, code son propre lecteur vidéo ; sa petite sœur Awa profite du résultat.">
  <p class="note">
    Lecture verticale, façon webtoon.<br>
    Édition papier : <a href="djesstube-ep1_A5.pdf" download>djesstube-ep1_A5.pdf</a> — format A5 (148 × 210 mm), 7 pages, 300 dpi.
  </p>
</main>
</body>
</html>
